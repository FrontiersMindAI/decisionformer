[project]
name = "decisionformer"
version = "0.2.0.dev0"
description = "Train, load, serve and benchmark one-pass decision models on any Hugging Face backbone."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "FrontiersMind AI" }]
keywords = ["transformers", "decision-model", "system-one", "jev", "classification", "fine-tuning", "lora", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6",
  "transformers>=5.20,<6",
  "peft>=0.21",
  "pydantic>=2.8",
  "omegaconf>=2.3",
  "pyyaml>=6",
  "safetensors>=0.4",
  "numpy>=1.26",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.45"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
vllm = ["fastapi>=0.110", "uvicorn>=0.29", "vllm>=0.12"]  # decision-model support: vLLM nightly from 2026-10-15
fla = ["flash-linear-attention>=0.5"]  # fast Gated DeltaNet kernels for Qwen3.5/3.8 backbones
data = ["datasets>=3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
decisionformer = "decisionformer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionformer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end or multi-process tests",
  "gpu: requires a CUDA device",
]
filterwarnings = ["ignore::DeprecationWarning"]
