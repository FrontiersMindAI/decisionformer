# Step 1 of a bidirectional decoder: masked next-token prediction (LLM2Vec-style) on in-domain text.
#   deciformer adapt configs/recipes/adapt_mntp.yaml
# Then train with model.backbone=runs/smollm2-mntp/adapted and model.attention=bidirectional.
# Budget generously: in docs/benchmarks.md, 150 steps restored the MNTP loss but not task information.
# Use plenty of in-domain text (more than the decision training set alone), bf16 or fp32, and compare the
# result against a causal baseline before adopting it.
base: ../base.yaml

model:
  backbone: HuggingFaceTB/SmolLM2-360M-Instruct
  attention: bidirectional
  head: {type: option_scoring}   # unused by `adapt`; kept so the same file validates for training

finetune:
  mode: lora
  lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05}

adapt:
  texts: data/mnli/train.jsonl
  text_field: state
  mask_probability: 0.2
  max_length: 512

train:
  output_dir: runs/smollm2-mntp
  max_steps: 2000
  global_batch_size: 64
  lr: 5.0e-5
  mixed_precision: bf16
