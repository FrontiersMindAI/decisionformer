# Decoder with bidirectional attention: every prompt token sees every other token, like an encoder.
# Each option is pooled from its own tokens and scored, so any number of options works in any order.
# Experimental for decoders: without a long adaptation stage (configs/recipes/adapt_mntp.yaml) this underperforms
# causal attention, often staying at chance; see docs/benchmarks.md. Prefer bf16/fp32: fp16 diverged here.
base: ../base.yaml

model:
  backbone: HuggingFaceTB/SmolLM2-360M-Instruct
  attention: bidirectional      # causal (default) | bidirectional | prefix_bidirectional
  head: {type: option_scoring, mlp_hidden: 256, dropout: 0.1}

finetune:
  mode: lora
  lora: {r: 32, lora_alpha: 64, lora_dropout: 0.05, target_modules: all-linear}

data:
  train: data/mnli/train.jsonl
  calibration: data/mnli/calibration.jsonl
  eval: {dev: data/mnli/dev.jsonl}

train:
  output_dir: runs/smollm2-bidirectional
  lr: 3.0e-4
  head_lr: 1.0e-3
  mixed_precision: bf16
  eval_every: 250
