# Demo: Qwen3.5-0.8B on FrontiersMind/deciformer-15k (9 tasks: safety, toxicity, QA, NLI, paraphrase, fact
# checking and intent routing in English and German; choice and noul questions), LoRA and the answer-code readout.
#   decisionformer data split hf:FrontiersMind/deciformer-15k:train --out data/deciformer-15k
#   decisionformer train configs/recipes/deciformer15k_qwen35.yaml
# The export is a Decision 3.0 code readout on Qwen3.5, so `decisionformer serve ... --backend vllm` can serve it.
# Trains in bf16; GPUs without bf16 (Turing, V100) fall back to fp16 automatically.
base: ../base.yaml

model:
  backbone: Qwen/Qwen3.5-0.8B
  attention: causal
  head: {type: code_readout}

finetune:
  mode: lora
  gradient_checkpointing: true
  lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: all-linear}

data:
  train: data/deciformer-15k/train.jsonl
  calibration: data/deciformer-15k/calibration.jsonl
  eval: {dev: data/deciformer-15k/dev.jsonl}
  max_length: 2048              # 6 of 11,982 training prompts are longer; their states are truncated in training

train:
  output_dir: runs/deciformer15k-qwen3.5-0.8b
  lr: 2.0e-4
  head_lr: 2.0e-5
  mixed_precision: bf16
  token_budget: 8192
  eval_every: 125
