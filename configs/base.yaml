# Shared defaults. Recipes inherit this file with `base: ../base.yaml` and override what they need.
data:
  max_length: 1024
  overflow: truncate_state_end   # training only: served models refuse over-long requests
  max_options: 255
  shuffle_options: true

train:
  seed: 42
  epochs: 1
  global_batch_size: 32
  micro_batch_size: 8
  weight_decay: 0.01
  max_grad_norm: 1.0
  scheduler: {type: cosine, warmup_ratio: 0.05, min_lr_ratio: 0.1}
  log_every: 10
  save_every: 500
  keep_last: 2
  resume: auto

eval:
  ece_bins: 15
  micro_batch_size: 32
  selection_metric: accuracy
  selection_mode: max
  use_calibrated: true
