[project]
name = "decisionformer"
version = "0.0.1"
description = "Train, load, serve and benchmark one-pass decision models on any Hugging Face backbone (placeholder release)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "FrontiersMind AI" }]
keywords = ["transformers", "decision-model", "system-one", "classification", "fine-tuning"]
classifiers = ["Development Status :: 1 - Planning", "Programming Language :: Python :: 3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionformer"]
